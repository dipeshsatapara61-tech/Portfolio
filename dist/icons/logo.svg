<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151F32" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="8" y="8" width="84" height="84" rx="22" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect x="10" y="10" width="80" height="80" rx="20" fill="none" stroke="url(#cyanIndigo)" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Analytics bar element -->
  <rect x="22" y="58" width="8" height="18" rx="3" fill="#38BDF8" opacity="0.85" />
  <rect x="34" y="44" width="8" height="32" rx="3" fill="url(#cyanIndigo)" />
  <rect x="46" y="32" width="8" height="44" rx="3" fill="#818CF8" />
  
  <!-- Monogram D S Line Art -->
  <path d="M 60 32 L 72 32 C 78 32 82 36 82 42 C 82 48 78 52 72 52 L 60 52 Z" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 78 56 C 81 58 83 62 82 66 C 80 72 74 74 68 74 C 62 74 58 70 58 67" fill="none" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Accent spark dot -->
  <circle cx="80" cy="24" r="3.5" fill="#38BDF8" filter="url(#glow)" />
</svg>
